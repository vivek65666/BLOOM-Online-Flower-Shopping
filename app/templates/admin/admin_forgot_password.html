<script type="text/javascript">
    $("#btn_otp").hide();
    $( document ).ready(function() {
    
    $("#btn_submit").click(function() {
    
        if($("#txtEmail").val() == "") {
           alert("Please Enter Email");
           $("#txtEmail").focus();
           return false;
        }
    
        const otp = Math.floor(1000 + Math.random() * 9999);
    
        $("#btn_submit").prop("disabled", true);
         // alert("alert");
        let formData = new FormData();
        formData.append("txtEmail", $("#txtEmail").val());
        formData.append("txtOTP", otp);
        formData.append("csrfmiddlewaretoken", $('input[name=csrfmiddlewaretoken]').val());
    
    
        $.ajax({ 
          url: "/admin_forgot_password_otp/",
          type: "POST",
          data: formData,
          processData: false,
          contentType: false,
          success: function(response) {
            
            if(response == 10) {
              alert("Not a Registered Email, Please add valid email");
              
            } else {
              $(".otp").show();
              $("#btn_submit").hide();
              $("#btn_otp").show();
            }
          }
    
        });
      });
    
    $("#btn_otp").click(function() {
    
            if($("#txtEmail").val() == "") {
                alert("Please Enter Email");
                $("#txtEmail").focus();
                return false;
            }
    
            if($("#txtOTP").val().length < 4) {
                alert("Please Enter Valid OTP");
                $("#txtOTP").focus();
                return false;
            }
    
            $("#btn_submit").prop("disabled", true);
            // alert("alert");
            let formData = new FormData();
            formData.append("txtEmail", $("#txtEmail").val());
            formData.append("txtOTP", $("#txtOTP").val());
            formData.append("csrfmiddlewaretoken", $('input[name=csrfmiddlewaretoken]').val());
    
    
            $.ajax({ 
            url: "/validate_otp/",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                
                if(response == 10) {
                alert("Invalid OTP");
                
                } else {
                    window.location = '/admin_update_password/';
                }
            }
    
        });
    });
    
});
       
</script>
